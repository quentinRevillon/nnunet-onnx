[project.scripts]
nnunet-export        = "nnunet_onnx.export:main"
nnunet-segment-onnx  = "nnunet_onnx.inference:_cli_onnx"
nnunet-segment-pt    = "nnunet_onnx.inference:_cli_pt"
nnunet-compare       = "nnunet_onnx.inference:_cli_compare"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnunet-onnx"
version = "0.1.0"
description = "Export nnUNet models to ONNX and run inference without PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nibabel",
    "numpy",
    "scipy",
    "scikit-image",
    "onnxruntime",
    "onnx",
    "tqdm",
]

[project.optional-dependencies]
export = [
    "torch",
    "nnunetv2",
    "onnxscript",
]
